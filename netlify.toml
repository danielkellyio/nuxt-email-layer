[build]
  base = "docs"
  command = "pnpm generate"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "20"

# Headers for better caching
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
